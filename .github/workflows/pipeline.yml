name: portfolio-pipeline

on:
  push:
    branches: [dev, main]

jobs:
  pruebas:
    name: Pruebas automáticas (dev)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Tests unitarios
        working-directory: backend
        run: npm run test:unit

      - name: Tests de integración
        working-directory: backend
        run: npm run test:integration

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        working-directory: frontend
        run: npm run test:e2e

  despliegue:
    name: Empaquetar y desplegar (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: rodr1g0258
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen del backend
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            rodr1g0258/portfolio-backend:latest
            rodr1g0258/portfolio-backend:${{ github.sha }}

      - name: Construir y subir imagen del frontend
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            rodr1g0258/portfolio-frontend:latest
            rodr1g0258/portfolio-frontend:${{ github.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Construir frontend
        working-directory: frontend
        run: npm run build

      - name: Desplegar URL pública en Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=rodrigo-zeballos-portfolio

      - name: Configurar Terraform
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Inicializar Terraform
        if: env.AWS_ACCESS_KEY_ID != ''
        working-directory: terraform
        run: terraform init

      - name: Crear la infraestructura
        if: env.AWS_ACCESS_KEY_ID != ''
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
        run: terraform apply -auto-approve

      - name: Obtener IP pública
        if: env.AWS_ACCESS_KEY_ID != ''
        id: infra
        working-directory: terraform
        run: echo "public_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

      - name: Instalar Ansible
        if: env.AWS_ACCESS_KEY_ID != ''
        run: pip install ansible

      - name: Escribir la llave SSH
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          printf '%s' '${{ secrets.SSH_PRIVATE_KEY }}' > ssh_key
          chmod 600 ssh_key

      - name: Crear el inventario
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          printf '[portfolio]\n%s ansible_user=ubuntu ansible_ssh_private_key_file=ssh_key\n' '${{ steps.infra.outputs.public_ip }}' > inventory.ini

      - name: Configurar la VM
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
        run: |
          ansible-playbook -i inventory.ini ansible/playbook.yml \
            -e dockerhub_username=rodr1g0258 \
            -e dockerhub_token='${{ secrets.DOCKERHUB_TOKEN }}' \
            -e image_tag='${{ github.sha }}'
