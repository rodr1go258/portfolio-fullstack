- name: Configurar la VM del portafolio
  hosts: portfolio
  become: true
  vars:
    app_dir: /opt/portfolio

  tasks:
    - name: Actualizar el índice de paquetes
      ansible.builtin.apt:
        update_cache: true

    - name: Instalar dependencias base
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - iptables
          - ufw
        state: present

    - name: Instalar Docker
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Habilitar el servicio de Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Agregar el usuario al grupo docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Permitir puertos 80 y 443 con iptables
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "{{ item }}"
        jump: ACCEPT
      loop:
        - 80
        - 443

    - name: Configurar el firewall con ufw
      ansible.builtin.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - 22
        - 80
        - 443

    - name: Habilitar ufw
      ansible.builtin.ufw:
        state: enabled
        policy: deny

    - name: Crear el directorio de la aplicación
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copiar docker-compose.yml
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Crear el archivo de variables
      ansible.builtin.copy:
        content: |
          DOCKERHUB_USERNAME={{ dockerhub_username }}
          IMAGE_TAG={{ image_tag }}
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Iniciar sesión en Docker Hub
      ansible.builtin.shell: echo "{{ dockerhub_token }}" | docker login -u "{{ dockerhub_username }}" --password-stdin
      no_log: true

    - name: Descargar las imágenes
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ app_dir }}"

    - name: Levantar los contenedores
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"
